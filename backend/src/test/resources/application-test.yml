spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  flyway:
    enabled: false

app:
  # No JWT key material is committed (C-1). Context-loading tests inject a
  # freshly generated keypair via @DynamicPropertySource using RsaTestKeys,
  # mirroring how production supplies APP_JWT_PRIVATE_KEY/APP_JWT_PUBLIC_KEY.
  jwt:
    public-key: ""
    private-key: ""
    public-key-path: ""
    private-key-path: ""
  encryption:
    key: "TestEncryptionKey2024ABCDEFGHIJ!"
  hmac:
    key: "TestHmacKey1234567890123456789012"
  storage:
    base-dir: ./test-uploads

logging:
  level:
    com.templeregistry: WARN
    org.springframework.security: WARN
