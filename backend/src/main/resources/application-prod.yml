# ============================================================================
# PRODUCTION PROFILE — TRACKED IN GIT ON PURPOSE (C-2)
#
# This file contains configuration ONLY. Every secret is an ${ENV_VAR}
# placeholder with NO default, so a missing variable aborts startup instead of
# silently falling back to a development value.
#
# Activate with: SPRING_PROFILES_ACTIVE=prod
#
# Required environment variables — see backend/.env.example:
#   DB_URL  DB_USERNAME  DB_PASSWORD
#   APP_ENCRYPTION_KEY  APP_HMAC_KEY            (32 bytes each)
#   APP_JWT_PRIVATE_KEY  APP_JWT_PUBLIC_KEY     (PEM contents)
#   APP_BASE_URL
#   SMTP_HOST  EMAIL_USERNAME  EMAIL_PASSWORD
#   APP_CORS_ALLOWED_ORIGINS
#
# ----------------------------------------------------------------------------
# DEPLOYMENT TOPOLOGY: RUN EXACTLY ONE APPLICATION REPLICA (H-7)
#
# This application is safe to run as a SINGLE instance only. It holds state in
# process that is not shared between instances, so a second replica does not
# merely scale throughput — it produces duplicate, user-visible side effects.
#
# Running two or more replicas WILL cause:
#   * Duplicate emails. EmailDeliveryService.processQueue (every 10s) and
#     processRetries (every 5m) select PENDING/FAILED rows with a plain
#     SELECT ... LIMIT and no row locking, so every replica claims the same
#     rows and sends the same message.
#   * Duplicate in-app notifications. NotificationRouter.dispatchPending
#     (every 5s) and retryFailed (every 60s) have the same problem.
#   * Duplicate deadline warnings. OverdueWorkflowScheduler.warnDeadlineApproaching
#     applies WARN_DEADLINE_APPROACHING, which does not change workflow status,
#     so no from-status guard prevents a second replica repeating it.
#     (flagOverdueInstances is protected: it moves the instance to OVERDUE and
#     WorkflowInstance carries an @Version column.)
#   * Missed real-time updates. SSE emitters live in a ConcurrentHashMap inside
#     SseNotificationService, so a push only reaches users connected to the
#     replica that produced it. Notifications are persisted to the database
#     first, so nothing is lost — the badge is just stale until the next load.
#   * Stale authorization decisions. The DACVM policy cache is in-process
#     Caffeine; @CacheEvict clears only the local replica, so others may serve
#     revoked permissions for up to the 5-minute TTL.
#   * Missing documents and failed downloads. See the storage note below.
#
# Multi-replica support is FUTURE WORK. Do not scale out until those
# dependencies are addressed. See HLD section 9.2 for the full inventory.
#
# STORAGE: app.storage.base-dir and trm.export.base-dir MUST point at storage
# that persists across restarts and redeployments — a mounted volume, not the
# container filesystem. Both defaults are relative paths that resolve inside
# the container's writable layer, where they are destroyed on every redeploy.
# ============================================================================

spring:
  datasource:
    # Inherited from application.yml, which already resolves ${DB_URL} /
    # ${DB_USERNAME} / ${DB_PASSWORD} with no defaults. Restated here so the
    # production contract is readable in one place.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate must never alter production tables.
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    # Schema + mandatory reference data ONLY — no dummy accounts, geo
    # hierarchy or sample temples are seeded anywhere, in any environment (C-5).
    locations: classpath:db/migration
    validate-on-migrate: true
    # A failed migration in production must be investigated by a human.
    # Auto-repair would silently rewrite checksum history and mask corruption.
    repair-on-migrate: false
    clean-disabled: true
    baseline-on-migrate: false

  security:
    debug: false

  mail:
    enabled: true
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    from: ${EMAIL_FROM:noreply@templeregistry.gov.in}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  # JWT RS256 keypair supplied as PEM by the platform secret store.
  # No key file is committed; JwtKeyProvider aborts startup if these are unset.
  jwt:
    private-key: ${APP_JWT_PRIVATE_KEY}
    public-key: ${APP_JWT_PUBLIC_KEY}
    # Explicitly blank: production must not fall back to an on-disk key.
    private-key-path: ""
    public-key-path: ""
    access-token-expiry-ms: ${APP_JWT_ACCESS_TOKEN_EXPIRY_MS:7200000}

  # 32-byte keys, required. CryptoKeyValidator additionally rejects the
  # historic development placeholders on this profile.
  encryption:
    key: ${APP_ENCRYPTION_KEY}

  hmac:
    key: ${APP_HMAC_KEY}

  base-url: ${APP_BASE_URL}

  # Must be an explicit allow-list — no localhost origins in production.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

  # Uploaded documents. MUST be a persistent, restart-surviving mount (H-7).
  # LocalFileStorageServiceImpl writes to the local filesystem, so this path is
  # also instance-local: a second replica cannot read what this one wrote.
  storage:
    base-dir: ${APP_STORAGE_BASE_DIR:./uploads}

  # Flyway auto-repair is a development-only affordance (see FlywayConfig).
  flyway:
    auto-repair: false

  notification:
    email-enabled: true

  legacy:
    enabled: false

  # Initial SUPER_ADMIN provisioning (C-5) is seed data now, not code: see
  # db/migration/V116__bootstrap_super_admin.sql and this file's
  # spring.flyway.placeholders (inherited from application.yml).

trm:
  # Generated export files. MUST be a persistent, restart-surviving mount (H-7).
  # AsyncExportBean writes <jobId>.<ext> here and DcExportController reads it
  # back by path, so on a second replica a completed job downloads as 404.
  export:
    base-dir: ${TRM_EXPORT_BASE_DIR:./exports}

# Abort startup if an email template referenced by a notification rule is missing.
email:
  startup-validation:
    fail-fast: true

# H-6: no API documentation in production.
#
# application.yml enables springdoc for local development, and that was inherited
# here: GET /v3/api-docs answered unauthenticated with a ~233 KB document
# describing every endpoint of all 39 controllers, and /swagger-ui.html served the
# UI. Both are switched off below.
#
# SecurityConfig reads springdoc.api-docs.enabled and only makes the documentation
# paths public while it is true, so here they require authentication like any other
# unknown path. Re-enabling this flag in production therefore republishes the API
# description publicly — that is the point of keeping one switch rather than two.
springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.templeregistry: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

management:
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

debug: false
