spring:
  config:
    import: optional:file:./dev-secrets.properties
  datasource:
    url: jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 20000
      connection-test-query: SELECT 1
      idle-timeout: 240000
      max-lifetime: 540000
      keepalive-time: 120000
      minimum-idle: 2
      maximum-pool-size: 8
      connection-init-sql: "SET tidb_enable_noop_functions=1"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    validate-on-migrate: false
    repair-on-migrate: true

  security:
    debug: false

  # Notification Module - Email Configuration
  mail:
    enabled: true # Set to true when you have SMTP configured
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    from: noreply@templeregistry.gov.in
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

trm:
  export:
    base-dir: ./exports

# Email notification system
email:
  startup-validation:
    # Set to true in prod to abort startup on missing templates
    fail-fast: false

app:
  flyway:
    auto-repair: true # dev-only: auto-repairs failed migrations on each startup. NEVER enable in production.
  jwt:
    private-key-path: classpath:keys/jwt-private.pem
    public-key-path: classpath:keys/jwt-public.pem
    access-token-expiry-ms: 7200000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,https://temple-registery.vercel.app
  encryption:
    # 32-byte dev key — ONLY safe in local/dev profile, never used in staging or prod
    key: ${APP_ENCRYPTION_KEY}
  hmac:
    # 32-byte dev key — ONLY safe in local/dev profile, never used in staging or prod
    key: ${APP_HMAC_KEY}
  storage:
    base-dir: ./uploads
  base-url: ${APP_BASE_URL:http://localhost:5173}

logging:
  level:
    com.templeregistry: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

management:
  health:
    mail:
      enabled: false
