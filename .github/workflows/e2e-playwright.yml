name: E2E Playwright

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - '.github/workflows/e2e-playwright.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      E2E_TARGET: dev
      E2E_READ_ONLY: false
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_API_ORIGIN: http://127.0.0.1:8080
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: temple_registry
      APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
      APP_HMAC_KEY: ${{ secrets.APP_HMAC_KEY }}
      APP_BASE_URL: http://127.0.0.1:3000
      SPRING_MAIL_ENABLED: false
      E2E_SA_USERNAME: ${{ secrets.E2E_SA_USERNAME }}
      E2E_SA_PASSWORD: ${{ secrets.E2E_SA_PASSWORD }}
      E2E_DC_USERNAME: ${{ secrets.E2E_DC_USERNAME }}
      E2E_DC_PASSWORD: ${{ secrets.E2E_DC_PASSWORD }}
      E2E_TA_USERNAME: ${{ secrets.E2E_TA_USERNAME }}
      E2E_TA_PASSWORD: ${{ secrets.E2E_TA_PASSWORD }}
      E2E_AUDITOR_USERNAME: ${{ secrets.E2E_AUDITOR_USERNAME }}
      E2E_AUDITOR_PASSWORD: ${{ secrets.E2E_AUDITOR_PASSWORD }}
      E2E_VIEWER_USERNAME: ${{ secrets.E2E_VIEWER_USERNAME }}
      E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: temple_registry
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Build backend
        run: mvn -f backend/pom.xml -DskipTests package

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Start backend
        run: |
          nohup mvn -f backend/pom.xml -DskipTests spring-boot:run > backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..90}; do
            if curl -fsS "http://127.0.0.1:8080/actuator/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready" >&2
          tail -n 200 backend.log || true
          exit 1

      - name: Start frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 3000 > frontend.log 2>&1 &
        working-directory: frontend

      - name: Wait for frontend
        run: |
          for i in {1..90}; do
            if curl -fsS "http://127.0.0.1:3000/login" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready" >&2
          tail -n 200 frontend.log || true
          exit 1

      - name: Run Playwright suites
        run: npm test
        working-directory: e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            backend.log
            frontend.log
